<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esta es una prueba de César</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f7f8fb;
            color: #333;
        }
        table {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            border-collapse: collapse;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        th, td {
            padding: 12px 14px;
            border: 1px solid #e1e4e8;
            text-align: left;
        }
        th {
            background: #eef1f6;
            color: #1f2937;
        }
        tr:nth-child(even) {
            background: #fbfcfd;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Edad</th>
        </tr>
        <tr>
            <td>César</td>
            <td>García</td>
            <td>30</td>
        </tr>
        <tr>
            <td>María</td>
            <td>Pérez</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Juan</td>
            <td>Gómez</td>
            <td>28</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>Martínez</td>
            <td>22</td>
        </tr>
    </table>
</body>
</html>
